schema_version: project_config/1.0.0
project_name: metrics_pipeline_harness
mode: BUILD
decisions:
- id: D-01
  question: Q-01
  answer: Databricks, normal SQL
  interpretation: Production runs on Databricks; pipelines are Databricks SQL (ANSI mode) run by a thin Python runner or Databricks
    Jobs. Python stays in the build harness only.
- id: D-02
  question: Q-02
  answer: code
  interpretation: When English and existing code disagree the code wins, per facet; English fills only facets the code is
    silent on; if both are silent the facet stays UNKNOWN.
- id: D-03
  question: Q-06
  answer: database in cloud
  interpretation: Source records live in a cloud-hosted database; tables the authoritative code queries are the first candidates
    for source contracts.
